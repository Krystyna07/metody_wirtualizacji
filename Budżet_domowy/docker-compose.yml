services:
  database:
    image: postgres:15-alpine
    container_name: budget_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: budget_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d budget_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: budget_backend
    restart: always
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres_user
      - DB_PASSWORD=postgres_password
      - DB_NAME=budget_db
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: budget_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
