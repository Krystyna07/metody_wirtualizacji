apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        resolver 10.96.0.10 valid=5s ipv6=off;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            set $backend_upstream http://budget-backend.default.svc.cluster.local:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-nginx
  template:
    metadata:
      labels:
        app: budget-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: budget-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: budget-nginx
spec:
  type: ClusterIP
  selector:
    app: budget-nginx
  ports:
    - port: 8080
      targetPort: 80