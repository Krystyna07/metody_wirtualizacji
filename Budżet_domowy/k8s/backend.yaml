apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-backend
  template:
    metadata:
      labels:
        app: budget-backend
    spec:
      containers:
        - name: backend
          image: budet_domowy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_HOST
              value: "database"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres_user"
            - name: DB_PASSWORD
              value: "super_secret_db_password_123"
            - name: DB_NAME
              value: "budzet_domowy"
---
apiVersion: v1
kind: Service
metadata:
  name: budget-backend
spec:
  type: ClusterIP
  selector:
    app: budget-backend
  ports:
    - port: 8000
      targetPort: 8000